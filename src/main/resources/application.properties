# Spring Boot Application Configuration
spring.application.name=worker-application

# AWS Configuration
aws.region=ap-northeast-1
aws.access-key-id=test
aws.secret-access-key=test

# AWS SQS Configuration
aws.sqs.endpoint=http://localhost:4566
aws.sqs.queue-name=worker-queue

# Spring Cloud AWS SQS Configuration
spring.cloud.aws.region.static=ap-northeast-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.sqs.endpoint=http://localhost:4566

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.worker=INFO
logging.level.io.awspring.cloud.sqs=INFO
logging.level.software.amazon.awssdk=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Spring Boot Banner Configuration
spring.main.banner-mode=console
