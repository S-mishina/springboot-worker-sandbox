spring:
  application:
    name: worker-application
  cloud:
    aws:
      region:
        static: ap-northeast-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566
        listener:
          max-messages-per-poll: 10
          max-concurrent-messages: 10
          poll-timeout: 10s
  main:
    banner-mode: console

aws:
  region: ${AWS_REGION:ap-northeast-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
    queue-name: ${AWS_SQS_QUEUE_NAME:worker-queue}
    consumer:
      enabled: ${AWS_SQS_CONSUMER_ENABLED:true}

logging:
  level:
    root: INFO
    com.example.worker: INFO
    io.awspring.cloud.sqs: INFO
    software.amazon.awssdk: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
